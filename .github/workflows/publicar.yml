name: Publicar página

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # Dia 5 de cada mês, 06:23 UTC: busca dados novos da Statistical Review
    - cron: "23 6 5 * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Atualizar dados da Statistical Review (Our World in Data)
        continue-on-error: true
        run: python scripts/atualizar_sr.py

      - name: Guardar dados atualizados no repositório
        run: |
          if [ -n "$(git status --porcelain dados)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dados
            git commit -m "Atualiza dados da Statistical Review"
            git push
          fi

      - name: Gerar a página
        run: python scripts/gerar_pagina.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
